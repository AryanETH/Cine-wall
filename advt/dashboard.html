<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Advertising dashboard | CineWall</title>
<link rel="stylesheet" href="/ads-admin.css"><script src="/ads-admin.js" defer></script></head>
<body><main id="adsDashboard">
<header><a class="brand" href="/">CineWall</a><button id="adsLogout" class="quiet" type="button">Log out</button></header>
<h1>Advertising</h1><p id="adsStatus" class="status" role="status">Loading settings…</p>
<div class="ads-grid">
<section>
<h2>Video library</h2>
<form id="uploadAd">
<label for="adTitle">Ad name</label><input id="adTitle" maxlength="80" required>
<label for="adDescription">Description (optional)</label><textarea id="adDescription" maxlength="200" rows="2"></textarea>
<label for="adFile">Ad video</label><input id="adFile" type="file" accept="video/mp4,.mp4" required>
<p class="hint">H.264 MP4, with AAC audio or no audio. Up to 60 seconds and 25 MiB.</p>
<button type="submit">Upload video</button>
</form>
<ul id="adLibrary"></ul>
</section>
<section>
<h2>Video wall pre-roll</h2><p class="hint">Set up to three slots. You can reuse any video.</p>
<form id="adSettings">
<label class="check"><input id="adsEnabled" type="checkbox"> Play ads before each new movie</label>
<div id="adSlots"></div>
<label for="adFormUrl">Advertiser contact link</label>
<input id="adFormUrl" type="url" placeholder="https://example.com/contact">
<button type="submit">Save settings</button>
</form>
</section>
</div>
</main></body></html>
